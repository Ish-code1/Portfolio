<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Point Cloud Portrait v3</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060c;
        color: #cfe;
        font: 13px system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        display: grid;
        gap: 7px;
        background: #0b1220cc;
        padding: 12px;
        border: 1px solid #1d2b45;
        border-radius: 10px;
        width: 220px;
        backdrop-filter: blur(6px);
        z-index: 2;
        max-height: 94vh;
        overflow: auto;
      }
      #ui label {
        display: grid;
        gap: 2px;
      }
      #ui .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      button,
      select {
        background: #12203a;
        color: #cfe;
        border: 1px solid #2a4066;
        border-radius: 6px;
        padding: 6px;
        cursor: pointer;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #6f8;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="pick">Choose photo</button>
      <input id="file" type="file" accept="image/*" hidden />
      <label
        >Cursor style
        <select id="style">
          <option value="0">Wind smear</option>
          <option value="1">Dust burst</option>
          <option value="2">Vortex swirl</option>
        </select>
      </label>
      <label
        >Scatter strength
        <input
          id="scat"
          type="range"
          min="0.2"
          max="2.5"
          step="0.05"
          value="1.2"
      /></label>
      <label
        >Cursor reach
        <input
          id="rad"
          type="range"
          min="0.05"
          max="0.5"
          step="0.01"
          value="0.2"
      /></label>
      <div class="row">
        <input id="sparks" type="checkbox" checked /><span
          >Dust sparks on cursor</span
        >
      </div>
      <label
        >Particles
        <input
          id="count"
          type="range"
          min="8000"
          max="70000"
          step="2000"
          value="40000"
      /></label>
      <label
        >Point size
        <input id="size" type="range" min="0.8" max="8" step="0.1" value="2.4"
      /></label>
      <label
        >Feature detail
        <input id="edge" type="range" min="0" max="1" step="0.05" value="0.6"
      /></label>
      <label
        >Brightness
        <input id="bri" type="range" min="0.5" max="1.6" step="0.05" value="1"
      /></label>
      <label
        >Background cutoff (dark)
        <input id="thr" type="range" min="0" max="120" step="2" value="25"
      /></label>
      <div class="row">
        <input id="light" type="checkbox" /><span>Remove light background</span>
      </div>
      <label
        >Color
        <select id="mode">
          <option value="0">Photo colors</option>
          <option value="1">Cyan ramp</option>
          <option value="2">White mono</option>
        </select>
      </label>
      <button id="replay">Replay intro</button>
    </div>
    <div id="hint">Click "Choose photo"</div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

      const $ = (id) => document.getElementById(id);
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const NT = 20; // trail length

      const renderer = new THREE.WebGLRenderer({
        antialias: false,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        innerWidth / innerHeight,
        0.1,
        50
      );
      const camZ = () => (innerWidth / innerHeight < 0.8 ? 4.4 : 3.2);
      camera.position.z = camZ();

      const uniforms = {
        uTime: { value: 0 },
        uProgress: { value: 0 },
        uSize: { value: 2.4 },
        uPR: { value: renderer.getPixelRatio() },
        uRadius: { value: 0.2 },
        uMode: { value: 0 },
        uStyle: { value: 0 },
        uScatter: { value: 1.2 },
        uTrail: {
          value: Array.from({ length: NT }, () => new THREE.Vector3(99, 99, 0)),
        },
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        transparent: true,
        depthWrite: false,
        vertexShader: `
    #define NT ${NT}
    uniform float uTime, uProgress, uSize, uPR, uRadius, uStyle, uScatter;
    uniform vec3 uTrail[NT];
    attribute vec3 aStart; attribute vec3 aColor; attribute float aRand; attribute float aLum;
    varying vec3 vColor; varying float vLum; varying float vGlow;
    void main(){
      float t = clamp(uProgress * 1.6 - aRand * 0.6, 0.0, 1.0);
      t = t * t * (3.0 - 2.0 * t);
      vec3 p = mix(aStart, position, t);
      float a = (1.0 - t) * (1.5 + aRand * 2.5);
      float ca = cos(a), sa = sin(a);
      p.xy = vec2(p.x * ca - p.y * sa, p.x * sa + p.y * ca);
      p.x += sin(uTime * 0.8 + aRand * 40.0) * 0.003;
      p.y += cos(uTime * 0.7 + aRand * 55.0) * 0.003;

      // cursor trail: fuzzy per-particle reach, brushed along the path
      float w0 = step(uStyle, 0.5);
      float w1 = step(0.5, uStyle) * step(uStyle, 1.5);
      float w2 = step(1.5, uStyle);
      vec2 turb = vec2(cos(aRand * 91.0), sin(aRand * 57.0));
      float reach = uRadius * (0.4 + aRand * 1.2);
      vec2 off = vec2(0.0); float glow = 0.0; float lift = 0.0;
      for (int i = 0; i < NT; i++) {
        vec3 tr = uTrail[i];
        if (tr.z < 0.001) continue;
        vec2 d = p.xy - tr.xy;
        float dist = length(d);
        float f = smoothstep(reach, 0.0, dist);
        f = f * f * tr.z;
        if (f < 0.0005) continue;
        vec2 dir = d / (dist + 1e-4);
        vec2 tang = vec2(-dir.y, dir.x);
        vec2 vel = (i < NT - 1) ? (tr.xy - uTrail[i + 1].xy) : vec2(0.0);
        if (length(vel) > 0.6) vel = vec2(0.0);
        vec2 vdir = vel / (length(vel) + 1e-4);
        vec2 push = w0 * (vdir * 1.0 + dir * 0.3 + turb * 0.7)
                  + w1 * (dir * 1.0 + turb * 0.9)
                  + w2 * (tang * 1.3 + dir * 0.2 + turb * 0.4);
        off += push * f * (0.5 + aRand);
        glow = max(glow, f);
        lift += f * (0.15 + aRand * 0.5);
      }
      p.xy += off * 0.35 * uScatter;
      p.z += lift * uScatter;
      vGlow = glow;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * (0.8 + aRand * 0.5) * (1.0 + glow * 0.8) * uPR * (3.0 / -mv.z);
      vColor = aColor; vLum = aLum;
    }`,
        fragmentShader: `
    uniform float uMode; varying vec3 vColor; varying float vLum; varying float vGlow;
    void main(){
      float r = length(gl_PointCoord - 0.5);
      if (r > 0.5) discard;
      vec3 ramp = mix(vec3(0.02, 0.25, 0.5), vec3(0.8, 1.0, 1.0), vLum);
      vec3 c = uMode < 0.5 ? vColor : (uMode < 1.5 ? ramp : vec3(vLum));
      c += vec3(0.0, 0.5, 0.6) * vGlow * 0.9;
      gl_FragColor = vec4(c, smoothstep(0.5, 0.2, r));
    }`,
      });

      let points = null,
        img = null,
        startTime = 0;
      const replay = () => (startTime = performance.now());

      function build() {
        if (!img) return;
        if (points) {
          scene.remove(points);
          points.geometry.dispose();
        }

        const MAXD = 360,
          s = Math.min(1, MAXD / Math.max(img.width, img.height));
        const w = Math.max(2, Math.round(img.width * s)),
          h = Math.max(2, Math.round(img.height * s));
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const d = ctx.getImageData(0, 0, w, h).data;

        const L = new Float32Array(w * h),
          vals = [];
        for (let i = 0; i < w * h; i++) {
          L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
          if (d[i * 4 + 3] > 40) vals.push(L[i]);
        }
        vals.sort((a, b) => a - b);
        const lo = vals[Math.floor(vals.length * 0.02)] ?? 0;
        const hi = vals[Math.floor(vals.length * 0.98)] ?? 255;
        const gamma = 1 / +$('bri').value;
        const LS = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++)
          LS[i] = Math.pow(
            Math.min(1, Math.max(0, (L[i] - lo) / Math.max(1, hi - lo))),
            gamma
          );

        const E = new Float32Array(w * h);
        const at = (x, y) =>
          LS[
            Math.min(h - 1, Math.max(0, y)) * w +
              Math.min(w - 1, Math.max(0, x))
          ];
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const gx =
              -at(x - 1, y - 1) -
              2 * at(x - 1, y) -
              at(x - 1, y + 1) +
              at(x + 1, y - 1) +
              2 * at(x + 1, y) +
              at(x + 1, y + 1);
            const gy =
              -at(x - 1, y - 1) -
              2 * at(x, y - 1) -
              at(x + 1, y - 1) +
              at(x - 1, y + 1) +
              2 * at(x, y + 1) +
              at(x + 1, y + 1);
            E[y * w + x] = Math.min(1, Math.hypot(gx, gy) * 0.9);
          }

        const thr = +$('thr').value,
          skipLight = $('light').checked,
          eb = +$('edge').value;
        const idx = [],
          cum = [];
        let total = 0;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (d[i * 4 + 3] <= 40 || L[i] <= thr || (skipLight && L[i] > 225))
              continue;
            total += (0.12 + 0.88 * LS[i]) * (1 + eb * 3 * E[i]);
            idx.push(i);
            cum.push(total);
          }
        if (!idx.length) return;

        const N = +$('count').value;
        const pos = new Float32Array(N * 3),
          st = new Float32Array(N * 3);
        const col = new Float32Array(N * 3),
          rnd = new Float32Array(N),
          lum = new Float32Array(N);
        const H = 2.2,
          W = (H * w) / h;

        for (let k = 0; k < N; k++) {
          const r = Math.random() * total;
          let a = 0,
            b = cum.length - 1;
          while (a < b) {
            const m = (a + b) >> 1;
            if (cum[m] < r) a = m + 1;
            else b = m;
          }
          const i = idx[a],
            x = i % w,
            y = (i / w) | 0;
          const sc = Math.min(3, LS[i] / Math.max(L[i] / 255, 0.03));
          const R = Math.min(1, (d[i * 4] / 255) * sc),
            G = Math.min(1, (d[i * 4 + 1] / 255) * sc),
            B = Math.min(1, (d[i * 4 + 2] / 255) * sc);
          pos.set(
            [
              ((x + Math.random()) / w - 0.5) * W,
              -((y + Math.random()) / h - 0.5) * H,
              (LS[i] - 0.5) * 0.35,
            ],
            k * 3
          );
          const an = Math.random() * 6.283,
            rad = 1.6 + Math.random() * 4.5;
          st.set(
            [Math.cos(an) * rad, Math.sin(an) * rad, -Math.random() * 2],
            k * 3
          );
          col.set([R, G, B], k * 3);
          lum[k] = LS[i];
          rnd[k] = Math.random();
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aStart', new THREE.BufferAttribute(st, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
        geo.setAttribute('aRand', new THREE.BufferAttribute(rnd, 1));
        geo.setAttribute('aLum', new THREE.BufferAttribute(lum, 1));
        points = new THREE.Points(geo, material);
        points.frustumCulled = false;
        scene.add(points);
        replay();
      }

      // ---- cursor dust sparks ----
      const SN = 220;
      const sp = new Float32Array(SN * 3).fill(99),
        sv = new Float32Array(SN * 3);
      const sc = new Float32Array(SN * 3),
        sl = new Float32Array(SN);
      const sgeo = new THREE.BufferGeometry();
      sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      sgeo.setAttribute('color', new THREE.BufferAttribute(sc, 3));
      const sparks = new THREE.Points(
        sgeo,
        new THREE.PointsMaterial({
          size: 2.4,
          sizeAttenuation: false,
          vertexColors: true,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      sparks.frustumCulled = false;
      scene.add(sparks);
      let sCur = 0;
      function emit(x, y, dx, dy, n) {
        for (let k = 0; k < n; k++) {
          const i = sCur++ % SN;
          sp[i * 3] = x + (Math.random() - 0.5) * 0.04;
          sp[i * 3 + 1] = y + (Math.random() - 0.5) * 0.04;
          sp[i * 3 + 2] = 0.3;
          sv[i * 3] = dx * 0.3 + (Math.random() - 0.5) * 0.014;
          sv[i * 3 + 1] = dy * 0.3 + (Math.random() - 0.5) * 0.014;
          sv[i * 3 + 2] = (Math.random() - 0.5) * 0.004;
          sl[i] = 0.7 + Math.random() * 0.3;
        }
      }
      function updateSparks() {
        for (let i = 0; i < SN; i++) {
          if (sl[i] > 0) {
            sp[i * 3] += sv[i * 3];
            sp[i * 3 + 1] += sv[i * 3 + 1];
            sp[i * 3 + 2] += sv[i * 3 + 2];
            sv[i * 3] *= 0.95;
            sv[i * 3 + 1] *= 0.95;
            sl[i] -= 0.022;
            const l = Math.max(sl[i], 0);
            sc[i * 3] = 0.3 * l;
            sc[i * 3 + 1] = 0.9 * l;
            sc[i * 3 + 2] = l;
          } else {
            sp[i * 3] = 99;
            sc[i * 3] = sc[i * 3 + 1] = sc[i * 3 + 2] = 0;
          }
        }
        sgeo.attributes.position.needsUpdate = true;
        sgeo.attributes.color.needsUpdate = true;
      }

      // ---- UI ----
      $('pick').onclick = () => $('file').click();
      $('file').onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const im = new Image();
        im.onload = () => {
          img = im;
          $('hint').style.display = 'none';
          build();
        };
        im.src = URL.createObjectURL(f);
      };
      $('size').oninput = (e) => (uniforms.uSize.value = +e.target.value);
      $('rad').oninput = (e) => (uniforms.uRadius.value = +e.target.value);
      $('scat').oninput = (e) => (uniforms.uScatter.value = +e.target.value);
      $('style').onchange = (e) => (uniforms.uStyle.value = +e.target.value);
      $('mode').onchange = (e) => (uniforms.uMode.value = +e.target.value);
      $('sparks').onchange = (e) => (sparks.visible = e.target.checked);
      ['count', 'edge', 'bri', 'thr', 'light'].forEach(
        (id) => ($(id).onchange = build)
      );
      $('replay').onclick = replay;

      const mouseN = new THREE.Vector2();
      let active = false;
      addEventListener('pointermove', (e) => {
        mouseN.set(
          (e.clientX / innerWidth) * 2 - 1,
          -((e.clientY / innerHeight) * 2 - 1)
        );
        active = true;
      });
      addEventListener('mouseout', (e) => {
        if (!e.relatedTarget) active = false;
      });
      addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.position.z = camZ();
        camera.updateProjectionMatrix();
      });

      const hist = Array.from({ length: NT }, () => ({ x: 99, y: 99, s: 0 }));
      let frame = 0,
        lx = null,
        ly = null,
        px = null,
        py = null;
      const v = new THREE.Vector3();

      function loop(now) {
        requestAnimationFrame(loop);
        uniforms.uTime.value = reduce ? 0 : now / 1000;
        uniforms.uProgress.value = reduce
          ? 1
          : Math.min(1, (now - startTime) / 2800);

        v.set(mouseN.x, mouseN.y, 0.5)
          .unproject(camera)
          .sub(camera.position)
          .normalize();
        const t = -camera.position.z / v.z;
        const wx = camera.position.x + v.x * t,
          wy = camera.position.y + v.y * t;

        // sparks emit by per-frame speed
        if (active && px !== null) {
          const dx = wx - px,
            dy = wy - py,
            sp2 = Math.hypot(dx, dy);
          if (!reduce && sp2 > 0.003)
            emit(wx, wy, dx, dy, Math.min(6, 1 + Math.floor(sp2 * 90)));
        }
        px = active ? wx : null;
        py = active ? wy : null;

        // trail history (a new point every 2 frames)
        frame++;
        if (frame % 2 === 0) {
          if (active && !reduce) {
            const sd = lx === null ? 0 : Math.hypot(wx - lx, wy - ly);
            hist.unshift({
              x: wx,
              y: wy,
              s: Math.min(1, sd * 10) * 0.8 + 0.25,
            });
            lx = wx;
            ly = wy;
          } else {
            hist.unshift({ x: 99, y: 99, s: 0 });
            lx = null;
          }
          hist.pop();
        }
        for (let i = 0; i < NT; i++) {
          const h = hist[i];
          uniforms.uTrail.value[i].set(
            h.x,
            h.y,
            h.s * Math.pow(1 - i / NT, 1.4)
          );
        }
        updateSparks();

        if (points && !reduce) {
          points.rotation.y += (mouseN.x * 0.12 - points.rotation.y) * 0.05;
          points.rotation.x += (-mouseN.y * 0.08 - points.rotation.x) * 0.05;
        }
        renderer.render(scene, camera);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
